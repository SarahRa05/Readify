<!-- frontend/views/register.html -->
<section class="card" style="max-width:520px;margin-inline:auto">
  <h1 class="h1">Register</h1>

  <form id="registerForm" style="margin-top:1rem" novalidate>
    <div class="row">
      <div>
        <label>Name</label>
        <input
          id="regFullName"
          name="full_name"
          placeholder="Your name"
          required
          minlength="2"
        >
      </div>

      <div>
        <label>Email</label>
        <input
          id="regEmail"
          name="email"
          type="email"
          placeholder="you@example.com"
          required
        >
      </div>
    </div>

    <div class="row">
      <div>
        <label>Password</label>
        <input
          id="regPassword"
          name="password"
          type="password"
          required
          minlength="2"
        >
      </div>

      <div>
        <label>Confirm Password</label>
        <input
          id="regPassword2"
          name="password2"
          type="password"
          required
          minlength="2"
        >
      </div>
    </div>

    <div style="margin-top:1rem">
      <button type="submit">Create Account</button>
    </div>

    <p style="margin-top:.6rem">Already have an account? <a href="#view_login">Login</a></p>
  </form>
</section>
