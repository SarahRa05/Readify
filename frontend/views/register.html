<section class="card" style="max-width:520px;margin-inline:auto">
  <h1 class="h1">Register</h1>

  <form id="registerForm" style="margin-top:1rem">
    <div class="row">
      <div>
        <label>Name</label>
        <input id="regFullName" placeholder="Your name" required>
      </div>
      <div>
        <label>Email</label>
        <input id="regEmail" type="email" placeholder="you@example.com" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Password</label>
        <input id="regPassword" type="password" required>
      </div>
      <div>
        <label>Confirm Password</label>
        <input id="regPassword2" type="password" required>
      </div>
    </div>

    <div style="margin-top:1rem">
      <button type="submit">Create Account</button>
    </div>
  </form>
</section>
