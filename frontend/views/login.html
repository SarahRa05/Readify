<section class="card" style="max-width:520px;margin-inline:auto">
  <h1 class="h1">Sign In</h1>

  <form id="loginForm" style="margin-top:1rem">
    <div>
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="you@example.com" required>
    </div>

    <div style="margin-top:.6rem">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="•••••••" required>
    </div>

    <div style="margin-top:1rem">
      <button type="submit">Sign In</button>
    </div>

    <p style="margin-top:.6rem">Don’t have an account? <a href="#view_register">Register</a></p>
  </form>
</section>
